name: Bug report
description: Something is not working as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or a short code sample.
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Affected package
      placeholder: LawnDart.EventSourcing
  - type: input
    id: version
    attributes:
      label: Package / commit
