name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build, test, docs
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore LawnDart.sln

    - name: Build kit target version
      run: python3 tools/check-build-kit-target.py

    - name: Build
      run: dotnet build LawnDart.sln --no-restore --configuration Release

    - name: Test (unit)
      run: >
        dotnet test LawnDart.sln --no-build --configuration Release
        --verbosity normal --filter "Category!=Integration"

    - name: Test reference slice
      run: >
        dotnet test samples/Library.Domain.Tests --no-build --configuration Release
        --verbosity normal

    - name: Test DCB reference slice
      run: >
        dotnet test samples/Library.Dcb.Domain.Tests --no-build --configuration Release
        --verbosity normal

    - name: Test (integration)
      run: |
        for proj in \
          tests/LawnDart.EventSourcing.SqlServer.Tests \
          tests/LawnDart.Messaging.SqlServer.Tests \
          tests/LawnDart.Messaging.RabbitMQ.Tests \
          tests/LawnDart.Messaging.AzureServiceBus.Tests \
          tests/LawnDart.Messaging.AwsSqs.Tests \
          tests/LawnDart.Projections.Lightweight.Tests \
          tests/LawnDart.Projections.Lightweight.SqlServer.Tests \
          tests/LawnDart.Backends.Contract.Tests
        do
          dotnet test "$proj" --no-build --configuration Release --verbosity normal \
            --filter "Category=Integration|Category=Contract"
        done

    - name: Restore local tools
      run: dotnet tool restore

    - name: DocFX metadata
      run: |
        if [ -n "$(python3 - <<'PY'
        import json
        cfg = json.load(open("docfx.json", encoding="utf-8"))
        files = []
        for metadata in cfg.get("metadata", []):
            for src in metadata.get("src", []):
                files.extend(src.get("files") or [])
        print("yes" if files else "")
        PY
        )" ]; then
          dotnet docfx metadata docfx.json
        else
          echo "No API DLL inputs yet; skipping metadata."
        fi

    - name: DocFX build
      run: dotnet docfx build docfx.json

  postgres-15:
    name: Postgres 15
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Path filter
      id: filter
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin "${{ github.base_ref }}" --depth=1
          base="origin/${{ github.base_ref }}"
        else
          base="HEAD^"
        fi
        git diff --name-only "$base"...HEAD > /tmp/changed.txt || git diff --name-only "$base" HEAD > /tmp/changed.txt
        if grep -Eq '^(src/LawnDart/|src/LawnDart.EventSourcing/|src/LawnDart.EventSourcing.Postgres/|src/LawnDart.Projections.Lightweight/|src/LawnDart.Messaging/|tests/LawnDart.Backends.Contract.Tests/|tests/LawnDart.TestUtilities/)' /tmp/changed.txt; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup .NET
      if: steps.filter.outputs.run == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Test Postgres 15
      if: steps.filter.outputs.run == 'true'
      env:
        LAWNDART_POSTGRES_IMAGE: postgres:15.15
        LAWNDART_PG_STRESS: long
      run: >
        dotnet test tests/LawnDart.Backends.Contract.Tests
        --configuration Release --verbosity normal
        --filter "FullyQualifiedName~Postgres&Category!=Benchmark"
